name: Compress images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pngquant
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant
      - name: Compress PNG files
        id: compress
        run: |
          set -euo pipefail
          shopt -s nullglob
          changed=0
          for f in images/*.png; do
            before=$(stat -c%s "$f")
            tmp="${f%.png}.tmp.png"
            if pngquant --force --quality=65-90 --skip-if-larger --output "$tmp" "$f"; then
              mv "$tmp" "$f"
            fi
            rm -f "$tmp"
            after=$(stat -c%s "$f")
            echo "$f: $before -> $after bytes"
            if [ "$before" -gt "$after" ]; then
              changed=1
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Commit optimized images
        if: steps.compress.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          git commit -m "chore: optimize images"
          git push
