name: Markdown lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/.markdownlint.json"
      - ".github/workflows/markdownlint.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/.markdownlint.json"
      - ".github/workflows/markdownlint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rules are explicitly enabled in the explicit configuration below.
      - name: Check Markdown syntax
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: .github/workflows/.markdownlint.json
          globs: "**/*.md"
