name: Link check

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 3
            --accept 200..299,403,429
            --exclude-path .git
            --exclude 'simpleicons\.org'
            --exclude 'skillicons\.dev'
            --exclude 'img\.shields\.io'
            "**/*.md"
          fail: true
